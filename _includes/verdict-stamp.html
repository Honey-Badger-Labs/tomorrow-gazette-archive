{%- comment -%} A verdict as the show's rubber stamp. size="large" for DOT's verdict. {%- endcomment -%}
{%- assign stamp_class = include.verdict | downcase | replace: ' ', '-' -%}
<p class="verdict-stamp verdict-{{ stamp_class }}{% if include.size %} verdict-stamp-{{ include.size }}{% endif %}"><span class="visually-hidden">Verdict: </span>{{ include.verdict }}</p>
