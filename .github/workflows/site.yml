# Builds the site and checks its links on every PR (A-T3, A-T4); deploys to
# GitHub Pages when main changes. The weekly run catches source links that die
# after their episode page was merged.
name: Site

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 08:00 SAST
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy half-way; let a newer push queue behind it.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

env:
  LYCHEE_VERSION: "0.18.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same build GitHub Pages runs, with the github-pages gem's pinned
      # versions, so a local `bundle exec jekyll build` matches it (AD1).
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Install lychee
        run: |
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check links
        run: tools/check-links.sh _site

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
        with:
          path: ./_site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
