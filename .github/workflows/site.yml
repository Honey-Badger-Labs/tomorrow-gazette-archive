# Checks episode pages, builds the site and checks its links on every PR
# (A-T8, A-T3, A-T4); deploys to
# GitHub Pages when main changes. The weekly run catches source links that die
# after their episode page was merged.
name: Site

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 08:00 SAST
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy half-way; let a newer push queue behind it.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

env:
  LYCHEE_VERSION: "0.24.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1 (v1.338.0)
        with:
          ruby-version: "3.3"

      # Runs before the build so a draft or an unsourced claim never reaches
      # the published site (A-T8).
      - name: Test the episode check
        run: ruby test/check_episodes_test.rb

      - name: Check episode pages
        run: ruby tools/check_episodes.rb

      # Every episode, special and podcast entry must have a real image.
      - name: Check every entry has an image
        run: ruby tools/check_images.rb

      # The same build GitHub Pages runs, with the github-pages gem's pinned
      # versions, so a local `bundle exec jekyll build` matches it (AD1).
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Install lychee
        run: |
          set -euo pipefail
          # Official checksum sidecar from the same GitHub release (never a self-computed hash).
          # v0.18.1 published no .sha256 files, so this workflow uses v0.24.2 which does.
          base="https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}"
          asset="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL "${base}/${asset}" -o "${RUNNER_TEMP}/${asset}"
          curl -sSfL "${base}/${asset}.sha256" -o "${RUNNER_TEMP}/${asset}.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c "${asset}.sha256")
          tar xz -C "$RUNNER_TEMP" -f "${RUNNER_TEMP}/${asset}"
          # v0.24.2 packs the binary in a subdirectory, so adding $RUNNER_TEMP
          # to PATH is not enough. Install into a location already on PATH.
          bin="$(find "$RUNNER_TEMP" -type f -name lychee -perm -111 | head -n1)"
          test -n "$bin"
          sudo install -m 0755 "$bin" /usr/local/bin/lychee
          command -v lychee
          lychee --version

      - name: Check links
        run: tools/check-links.sh _site

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
        with:
          path: ./_site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
