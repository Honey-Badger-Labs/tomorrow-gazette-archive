<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Main">
      <a href="{{ '/episodes/' | relative_url }}">Episodes</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </header>

  <main id="content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>Tomorrow Gazette is made with AI tools. Vera Tomorrow and DOT are AI-generated characters. <a href="{{ '/about/' | relative_url }}">How we work</a></p>
    <p>Watch on
      {% for channel in site.channels %}<a href="{{ channel.url }}">{{ channel.name }}</a>{% unless forloop.last %} · {% endunless %}{% endfor %}
    </p>
  </footer>
</body>
</html>
