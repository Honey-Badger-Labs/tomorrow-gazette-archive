# Failure alerts (adapted from GH1MA's pipeline-monitor.yml.disabled).
# When a Site run fails on main or on its schedule (not on a pull request,
# where the PR already shows it), open one issue labelled "ci-failure". Later
# failures add a comment to that issue; the next green run closes it.
#
# NOT ACTIVE while it sits in ops/: GitHub only runs workflows in .github/workflows/.
# The box token can't push workflow files, so Jakes moves it in via the web UI:
# /workspace/notes/ADD-FAILURE-ALERTS.md. Free Actions minutes; no secrets.
#
# Safety: workflow_run runs with this repo's token, so this file never checks
# out code and never pastes run data into a shell; it only reads the run and
# writes issues.
name: Failure alerts

on:
  workflow_run:
    workflows: ["Site"]
    types: [completed]

permissions:
  actions: read
  issues: write

jobs:
  alert:
    if: >-
      github.event.workflow_run.event != 'pull_request' &&
      contains(fromJSON('["failure", "timed_out", "success"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const label = "ci-failure";
            const title = `CI failing: ${run.name}`;
            const when = new Date(run.updated_at).toLocaleString("en-ZA", { timeZone: "Africa/Johannesburg", dateStyle: "medium", timeStyle: "short" }) + " SAST";
            const open = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", labels: label, per_page: 100 }))
              .filter((i) => !i.pull_request && i.title === title);

            if (run.conclusion === "success") {
              for (const issue of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                  body: `✅ Green again: [run #${run.run_number}](${run.html_url}) passed (${run.event}, ${when}). Closing.` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed", state_reason: "completed" });
              }
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id: run.id, filter: "latest", per_page: 100 });
            const failed = jobs.filter((j) => ["failure", "timed_out"].includes(j.conclusion)).map((j) => {
              const steps = (j.steps || []).filter((s) => s.conclusion === "failure").map((s) => s.name);
              return `- ❌ [${j.name}](${j.html_url})${steps.length ? `: step "${steps.join('", "')}"` : ""}`;
            });
            const details = [
              `**[Run #${run.run_number}](${run.html_url})** of **${run.name}** ${run.conclusion === "timed_out" ? "timed out" : "failed"}.`,
              "",
              `- When: ${when}`,
              `- Trigger: ${run.event}${run.event === "schedule" ? " (the weekly run: often a source link that died)" : ""}`,
              `- Branch: \`${run.head_branch}\` · commit \`${run.head_sha.slice(0, 7)}\``,
              "",
              "Failed:",
              ...(failed.length ? failed : ["- (no failed job reported; open the run)"]),
            ].join("\n");

            if (open.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body: `🔁 Failed again.\n\n${details}` });
              return;
            }
            try {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: "B60205", description: "A scheduled or main-branch CI run failed" });
            } catch (e) {
              if (e.status !== 422) throw e; // 422: the label already exists
            }
            await github.rest.issues.create({ owner, repo, title, labels: [label], body:
              `${details}\n\nOpen the run, fix the cause on a branch, and open a PR. The next green run on main or on schedule closes this issue by itself.\n\n_Opened by ops failure alerts (pattern from GH1MA pipeline monitor)._` });
